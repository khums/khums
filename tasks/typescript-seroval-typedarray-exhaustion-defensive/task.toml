schema_version = "1.0"

[metadata]
author_organization = "Turing"
category = "cybersecurity"
benchmark_type = "cyber-bench"
tags = ["defensive", "source-audit", "typescript", "resource-safety", "security-hardening"]
expert_time_estimate_hours = 4.0

[verifier]
timeout_sec = 1200.0

[verifier.env]
ANTHROPIC_API_KEY = "${ANTHROPIC_API_KEY}"

[agent]
timeout_sec = 10800.0
user = "agent"
network_mode = "allowlist"
allowed_hosts = ["api.anthropic.com"]

[environment]
allow_internet = false
build_timeout_sec = 1200.0
cpus = 4
memory_mb = 8192
storage_mb = 24576
